name: Build and Release

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
  WEB_API_KEY: ${{ secrets.WEB_API_KEY }}
  ANDROID_API_KEY: ${{ secrets.ANDROID_API_KEY }}
  IOS_API_KEY: ${{ secrets.IOS_API_KEY }}

defaults:
  run:
    shell: bash

jobs:
  # Android and web are separate jobs on purpose: a patch failure used to take
  # the web deploy down with it, which is why the hosted app sat four months
  # behind main while the patch step was red.
  patch_android:
    name: 🐦 Patch Android
    runs-on: ubuntu-latest

    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@v5

      - name: 📚 Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: 📚 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: "3.41.9"

      - name: 📚 Flutter Pub Get
        run: flutter pub get

      - name: 🐦 Setup Shorebird
        uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true

      - name: 🚀 Shorebird Patch
        id: shorebird-patch
        uses: shorebirdtech/shorebird-patch@v0
        with:
          # Pinning the release skips the extra build shorebird otherwise runs
          # just to guess which release to patch (452s in run #132, on whatever
          # Flutter is newest that day). Bump this when you cut a new release.
          args: --release-version=2.3.0+6 --track=stable --allow-native-diffs -- --no-tree-shake-icons
          platform: android

      - name: 📝 Output Patch Version
        run: echo ${{ steps.shorebird-patch.outputs.patch-number }}

      #- run: flutter build apk
      #- run: flutter build appbundle
      #- name: 🚀 GitHub Release
      #uses: ncipollo/release-action@v1
      #with:
      #artifacts: "build/app/outputs/flutter-apk/app-release.apk"
      #tag: v0.1.${{ github.run_number }}
      #name: Chores v0.1.${{ github.run_number }}
      #token: ${{ secrets.TOKEN }}

  deploy_web:
    name: 🌐 Deploy Web
    runs-on: ubuntu-latest

    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@v5

      - name: 📚 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: "3.41.9"

      - name: 📚 Flutter Pub Get
        run: flutter pub get

      - name: 📚 Build Web Version
        run: flutter build web --wasm --no-tree-shake-icons

      - name: 🚀 Deploy to Firebase Hosting
        if: github.event_name == 'push'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CHORES_4725C }}
          channelId: live
          projectId: chores-4725c
